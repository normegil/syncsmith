name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cargo-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  cargo-publish:
    name: cargo publish (${{ github.event.release.tag_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: verify release tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | sed 's/.*\"\(.*\)\"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)." >&2
            echo "Update the version in Cargo.toml before tagging." >&2
            exit 1
          fi
          echo "Release tag $TAG_VERSION matches Cargo.toml."

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
