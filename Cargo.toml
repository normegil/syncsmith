[package]
name = "syncsmith"
version = "0.2.0"
edition = "2024"
description = "syncsmith keeps files synchronized between a source (git repo or folder) and a target git repository, driven by a .syncsmith.toml file."
license = "AGPL-3.0-or-later"
repository = "https://github.com/normegil/syncsmith"
include = [
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE",
  "README.md",
  "src/**/*",
  "tests/**/*",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3"
inquire = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
